name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the C harness
        # benches/ and fuzz/ build scripts expect the harness objects to exist.
        # comparison-bin builds it itself, so its test also works standalone.
        run: make -C ffi-harness
      - name: Lints
        run: cargo clippy --workspace --all-targets
      - name: Unit tests
        run: cargo test --workspace

  coverage:
    name: Library coverage
    runs-on: ubuntu-latest
    env:
      # Floor on library line coverage. Raise it when the real number rises;
      # never lower it to turn a red build green.
      COVERAGE_FLOOR: "85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report -p libinjectionrs --lib
          cargo llvm-cov report --summary-only | tee coverage.txt
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Library coverage'
            echo
            echo '```'
            cat coverage.txt || echo '(no summary produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce the coverage floor
        run: cargo llvm-cov report --fail-under-lines "${COVERAGE_FLOOR}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  differential:
    name: Differential against the C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The port's whole correctness claim is agreement with the C library, so
      # this is the job that matters. It compiles the C sources through the FFI
      # harness and compares verdicts and fingerprints over libinjection's own
      # corpus of roughly 163,000 inputs.
      - name: Compare verdicts and fingerprints over the full corpus
        run: cargo test --release -p libinjection-comparison --test differential -- --nocapture

  fuzz:
    name: Differential fuzzing (reporting)
    runs-on: ubuntu-latest
    # A short per-pull-request smoke test: two minutes per detector, enough to
    # catch an obvious new divergence class quickly. It reports rather than
    # gates, since a probabilistic short run is a weak signal to block a merge
    # on; the corpus differential above is the deterministic gate. The long
    # campaign lives in fuzz-campaign.yml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build the C harness
        # benches/ and fuzz/ build scripts expect the harness objects to exist.
        # comparison-bin builds it itself, so its test also works standalone.
        run: make -C ffi-harness
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Short by design: enough to surface a class on every pull request, not
      # a replacement for the long campaign. The corpus is committed, so runs
      # build on each other.
      - name: Fuzz SQLi differential
        run: cargo fuzz run fuzz_differential_sqli -- -max_total_time=120
      - name: Fuzz XSS differential
        run: cargo fuzz run fuzz_differential_xss -- -max_total_time=120
