[package]
name = "barbacane-libinjection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/barbacane-dev/libinjectionrs"
description = "A memory-safe Rust port of libinjection (SQL injection and XSS detection), differential-tested against the C library"
readme = "README.md"
keywords = ["security", "sql-injection", "xss", "detection", "web-security"]
categories = ["web-programming", "parser-implementations"]
# Include generated data file and workspace README in published package  
include = ["src/**/*", "build.rs", "Cargo.toml", "README.md"]

[dependencies]
bitflags = { workspace = true }
smallvec = { workspace = true, optional = true }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
urlencoding = "2.0"

[features]
default = ["std", "smallvec"]
std = []
smallvec = ["dep:smallvec"]

[lib]
name = "libinjectionrs"
path = "src/lib.rs"

[lints]
workspace = true